name: Release Asset

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild and attach
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-attach:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew clean test build --no-daemon
      - name: Attach server JAR and checksum
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          asset="build/libs/HunterCompass-${version}.jar"
          test -f "$asset"
          sha256sum "$asset" > "${asset}.sha256"
          gh release upload "$RELEASE_TAG" "$asset" "${asset}.sha256" --clobber
