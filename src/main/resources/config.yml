# How often coordinates and compass needles update. 10 ticks = twice per second.
update-interval-ticks: 10

# Real 24-hour days. Server downtime and player disconnects do not pause the deadline.
duration-real-days: 7

# Enroll eligible players when an event starts or when they join later.
auto-enroll-eligible-players: true

boss-bar:
  enabled: true
  format: "<gold>Jagd auf <red><bold>{target}</bold></red> <dark_gray>•</dark_gray> <yellow>Tag {day}/{total-days}</yellow>"
  color: "RED"

compass:
  name: "<gold><bold>Hunter Compass</bold></gold>"
  lore:
    - "<gray>Tracks the current event target.</gray>"
    - "<dark_gray>Coordinates stay visible in the action bar.</dark_gray>"
  prevent-dropping: true
  prevent-container-storage: true

action-bar:
  format: "<gold>{target}</gold> <dark_gray>|</dark_gray> <yellow>X {x}  Y {y}  Z {z}</yellow> <dark_gray>|</dark_gray> <aqua>{dimension}</aqua> <dark_gray>|</dark_gray> <white>{direction}</white>"
  offline-format: "<gold>{target}</gold> <dark_gray>|</dark_gray> <red>{offline}</red>"

dimensions:
  overworld: "Overworld"
  nether: "Nether"
  end: "The End"
  other: "Other"

direction-labels:
  exact: "exact direction"
  portal: "scaled portal direction"
  unavailable: "direction unavailable"
  offline: "target offline"

messages:
  prefix: "<gold>[HunterCompass]</gold> "
  victory: "<gold><bold>{hunter}</bold></gold> caught <red><bold>{target}</bold></red>!"
  target-victory: "<green><bold>{target}</bold></green> survived {days} real days and won the hunt!"
  drop-blocked: "<red>The Hunter Compass cannot be dropped.</red>"
